// ─── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = "dinner-planner-recipes-v2";
const PLAN_KEY    = "dinner-planner-week-v2";

async function loadRecipes() {
  try { const v = localStorage.getItem(STORAGE_KEY); if (v) return JSON.parse(v); } catch {}
  return [];
}
async function saveRecipes(recipes) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes)); } catch(e) { console.error(e); }
}
async function loadPlan() {
  try { const v = localStorage.getItem(PLAN_KEY); if (v) return JSON.parse(v); } catch {}
  return null;
}
async function savePlan(plan) {
  try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch(e) { console.error(e); }
}

// ─── Grocery List Builder ────────────────────────────────────────────────────

// Strip qualifiers like "for fries", "for the rice", "for topping", etc.
// and normalize common variations so duplicates get merged correctly.
function normalizeName(raw) {
  return raw
    .toLowerCase()
    .trim()
    // Remove "for X" suffixes e.g. "olive oil for fries", "butter for rice"
    .replace(/\s+for\s+(the\s+)?\w+(\s+\w+)?$/i, "")
    // Remove parenthetical notes e.g. "chicken breasts (boneless)"
    .replace(/\s*\(.*?\)/g, "")
    // Collapse extra whitespace
    .trim()
    // Common plural/singular normalizations
    .replace(/cloves?$/, "cloves")
    .replace(/breasts?$/, "breast")
    .replace(/thighs?$/, "thigh")
    .replace(/leaves?$/, "leaves")
    .replace(/tomatoes?$/, "tomato")
    .replace(/potatoes?$/, "potato")
    .trim();
}

// Convert units to a common base for same-ingredient aggregation
// Returns { quantity, unit } normalized to the larger unit where sensible
function normalizeUnit(quantity, unit) {
  const u = (unit || "").toLowerCase().trim();
  // Normalize unit aliases
  const aliases = { "clove": "cloves", "tbsp": "tbsp", "tablespoon": "tbsp", "tablespoons": "tbsp",
    "tsp": "tsp", "teaspoon": "tsp", "teaspoons": "tsp", "cup": "cup", "cups": "cup",
    "oz": "oz", "ounce": "ounces", "ounces": "oz", "lb": "lbs", "pound": "lbs", "pounds": "lbs",
    "g": "g", "gram": "g", "grams": "g", "ml": "ml", "milliliter": "ml", "milliliters": "ml",
    "piece": "pieces", "slice": "slices" };
  const normUnit = aliases[u] || u;
  return { quantity: Number(quantity) || 0, unit: normUnit };
}

function buildGroceryList(plan, recipes) {
  // map key: normalizedName__normalizedUnit
  const map = {};

  plan.filter(d => !d.skipped && d.recipeId).forEach(d => {
    const recipe = recipes.find(r => r.id === d.recipeId);
    if (!recipe) return;

    recipe.ingredients.forEach(ing => {
      const normName = normalizeName(ing.name);
      const { quantity, unit } = normalizeUnit(ing.quantity, ing.unit);
      const key = normName + "__" + unit;

      if (map[key]) {
        map[key].quantity = Math.round((map[key].quantity + quantity) * 100) / 100;
      } else {
        // Use the shortest/cleanest version of the name as display name
        const existing = Object.values(map).find(v => normalizeName(v.rawName) === normName);
        const displayName = existing
          ? (existing.rawName.length <= ing.name.length ? existing.rawName : ing.name)
          : ing.name;
        map[key] = {
          rawName: ing.name,
          name: displayName,
          quantity,
          unit,
          category: ing.category || "other"
        };
      }
    });
  });

  // Post-process: if two keys share the same normName but different units, keep separate
  // (e.g. "lemon juice" in cups vs tbsp — don't merge those)
  const result = Object.values(map).map(({ rawName, ...rest }) => rest);
  return result.sort((a, b) => a.name.localeCompare(b.name));
}

function encodeShareUrl(plan, recipes) {
  const active = plan.filter(d => !d.skipped && d.recipeId).map(d => {
    const r = recipes.find(r => r.id === d.recipeId);
    return { day: d.day, name: r?.name || "", url: r?.url || "" };
  });
  const grocery = buildGroceryList(plan, recipes);
  const payload = JSON.stringify({ schedule: active, grocery });
  return window.location.origin + window.location.pathname + "?share=" + encodeURIComponent(btoa(payload));
}

function decodeShareUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("share");
    if (!raw) return null;
    return JSON.parse(atob(decodeURIComponent(raw)));
  } catch { return null; }
}

// ─── Constants ────────────────────────────────────────────────────────────────
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const CATEGORIES = ["produce","meat","seafood","dairy","pantry","grains","spices","other"];
const UNITS = ["tsp","tbsp","cup","oz","lbs","g","ml","cloves","slices","pieces","pinch",""];
const BLANK_ING = () => ({ id: Math.random().toString(36).slice(2), name:"", quantity:"", unit:"cup", category:"pantry" });

// ─── Planner Logic ────────────────────────────────────────────────────────────
function buildEmptyWeek() {
  return DAYS.map(day => ({ day, recipeId: null, skipped: false }));
}

function generateWeek(recipes, currentPlan) {
  if (recipes.length < 7) return currentPlan;
  const shuffled = [...recipes].sort(() => Math.random() - 0.5);
  return DAYS.map((day, i) => ({ day, recipeId: shuffled[i].id, skipped: false }));
}

function rerollDay(dayIndex, recipes, plan) {
  const usedIds = plan
    .filter((d, i) => i !== dayIndex && !d.skipped && d.recipeId)
    .map(d => d.recipeId);
  const available = recipes.filter(r => !usedIds.includes(r.id));
  if (!available.length) return plan;
  const pick = available[Math.floor(Math.random() * available.length)];
  return plan.map((d, i) => i === dayIndex ? { ...d, recipeId: pick.id, skipped: false } : d);
}

// ─── Recipe JSON import ───────────────────────────────────────────────────────
function parseRecipeJson(raw) {
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error("No JSON object found. Make sure you copied the full snippet from Claude.");
  const parsed = JSON.parse(match[0]);
  if (!parsed.name || !Array.isArray(parsed.ingredients))
    throw new Error("JSON is missing required fields (name, ingredients).");
  return parsed;
}

// ─── RecipeCard ───────────────────────────────────────────────────────────────
function RecipeCard({ recipe, onDelete }) {
  const [exp, setExp] = useState(false);
  const prev = recipe.ingredients.slice(0, 4);
  const more = recipe.ingredients.length - 4;
  return (
    <div className="card">
      <div className="card-top">
        <div>
          <div className="card-name">{recipe.name}</div>
          <div className="card-meta">🍽 {recipe.servings} servings · {recipe.ingredients.length} ingredients</div>
        </div>
        <button className="btn-g" onClick={() => onDelete(recipe.id)} title="Remove">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
      {recipe.url && (
        <a href={recipe.url} target="_blank" rel="noopener noreferrer" className="card-link">
          🔗 {recipe.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,50)}{recipe.url.length>55?"…":""}
        </a>
      )}
      {!exp ? (
        <>
          <div className="tags">
            {prev.map((ing,i) => <span key={i} className="tag">{ing.name}</span>)}
            {more > 0 && <span className="tag tag-more">+{more} more</span>}
          </div>
          <button className="exp-btn" onClick={() => setExp(true)}>View all ingredients ↓</button>
        </>
      ) : (
        <div className="ing-full">
          <h4>All Ingredients</h4>
          <ul>
            {recipe.ingredients.map((ing,i) => (
              <li key={i}><span>{ing.name}</span><span className="ing-qty">{ing.quantity}{ing.unit ? " "+ing.unit : ""}</span></li>
            ))}
          </ul>
          <button className="exp-btn" style={{marginTop:".5rem"}} onClick={() => setExp(false)}>Collapse ↑</button>
        </div>
      )}
    </div>
  );
}

  const [url, setUrl] = useState("");
  const [servings, setServings] = useState(4);
  const [ings, setIngs] = useState([BLANK_ING()]);

  const upd = (id,f,v) => setIngs(p => p.map(i => i.id===id ? {...i,[f]:v} : i));
  const add = () => setIngs(p => [...p, BLANK_ING()]);
  const rem = (id) => setIngs(p => p.filter(i => i.id!==id));

  const save = () => {
    if (!name.trim()) { alert("Please enter a recipe name."); return; }
    const valid = ings.filter(i => i.name.trim());
    if (!valid.length) { alert("Please add at least one ingredient."); return; }
    onSave({
      id: Date.now().toString(),
      name: name.trim(), url: url.trim(),
      servings: Number(servings)||4,
      ingredients: valid.map(({id,...r}) => ({...r, quantity: Number(r.quantity)||1})),
      addedAt: new Date().toISOString(),
    });
  };

  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hdr">
          <h2>Add New Recipe</h2>
          <button className="btn-g" onClick={onClose}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div className="modal-body">
          <div className="row2">
            <div className="field">
              <label>Recipe Name *</label>
              <input className="inp" placeholder="e.g. Lemon Garlic Chicken" value={name} onChange={e=>setName(e.target.value)} />
            </div>
            <div className="field">
              <label>Servings</label>
              <input className="inp" type="number" min="1" max="20" value={servings} onChange={e=>setServings(e.target.value)} />
            </div>
          </div>
          <div className="field">
            <label>Recipe URL (optional)</label>
            <input className="inp" placeholder="https://..." value={url} onChange={e=>setUrl(e.target.value)} />
          </div>
          <div className="field">
            <label>Ingredients *</label>
            <div className="ing-row-hdr">
              <span>Ingredient</span><span>Qty</span><span>Unit</span><span>Category</span><span></span>
            </div>
            <div className="ing-rows">
              {ings.map(ing => (
                <div key={ing.id} className="ing-row">
                  <input className="inp" placeholder="e.g. chicken breast" value={ing.name} onChange={e=>upd(ing.id,"name",e.target.value)} />
                  <input className="inp" type="number" min="0" step="0.25" placeholder="1" value={ing.quantity} onChange={e=>upd(ing.id,"quantity",e.target.value)} />
                  <select className="inp" value={ing.unit} onChange={e=>upd(ing.id,"unit",e.target.value)}>
                    {UNITS.map(u=><option key={u} value={u}>{u||"—"}</option>)}
                  </select>
                  <select className="inp" value={ing.category} onChange={e=>upd(ing.id,"category",e.target.value)}>
                    {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                  <button className="btn-g" onClick={()=>rem(ing.id)} disabled={ings.length===1}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </button>
                </div>
              ))}
            </div>
            <button className="add-ing" onClick={add}>+ Add ingredient</button>
          </div>
        </div>
        <div className="modal-ftr">
          <button className="btn-s" onClick={onClose}>Cancel</button>
          <button className="btn-p" onClick={save}>Save Recipe</button>
        </div>
      </div>
    </div>
  );
}

// ─── DayRow ───────────────────────────────────────────────────────────────────
function DayRow({ slot, recipes, onReroll, onSkip, onPick }) {
  const [picking, setPicking] = useState(false);
  const recipe = recipes.find(r => r.id === slot.recipeId);

  return (
    <div className={`day-card${slot.skipped ? " skipped" : ""}${!slot.recipeId && !slot.skipped ? " empty" : ""}`}>
      <div className="day-label">{slot.day}</div>

      {slot.skipped ? (
        <span className="day-skipped">— Night off</span>
      ) : recipe ? (
        <div className="day-recipe">
          <div className="day-recipe-name">
            {recipe.url
              ? <a href={recipe.url} target="_blank" rel="noopener noreferrer">{recipe.name}</a>
              : recipe.name}
          </div>
          <div className="day-recipe-meta">🍽 {recipe.servings} servings · {recipe.ingredients.length} ingredients</div>
        </div>
      ) : (
        <span className="day-empty">No meal selected</span>
      )}

      <div className="day-actions">
        {picking ? (
          <>
            <select
              className="day-select"
              defaultValue=""
              autoFocus
              onChange={e => { if (e.target.value) { onPick(e.target.value); setPicking(false); } }}
              onBlur={() => setPicking(false)}
            >
              <option value="" disabled>Choose a recipe…</option>
              {recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
            <button className="btn-icon" onClick={() => setPicking(false)}>✕</button>
          </>
        ) : (
          <>
            <button className="btn-icon" onClick={onReroll} title="Random meal" disabled={slot.skipped}>🔀</button>
            <button className="btn-icon" onClick={() => setPicking(true)} title="Choose specific meal" disabled={slot.skipped}>📋</button>
            <button
              className={`btn-icon${slot.skipped ? " active" : " danger"}`}
              onClick={onSkip}
              title={slot.skipped ? "Restore day" : "Skip this night"}
            >
              {slot.skipped ? "↩" : "✕"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ─── SummaryView ─────────────────────────────────────────────────────────────
function SummaryView({ plan, recipes, onBack }) {
  const [copied, setCopied] = useState(false);
  const [shareUrl, setShareUrl] = useState("");

  useEffect(() => {
    if (plan && recipes.length) setShareUrl(encodeShareUrl(plan, recipes));
  }, [plan, recipes]);

  if (!plan) return null;

  const activeDays = plan.filter(d => !d.skipped && d.recipeId);
  const groceryList = buildGroceryList(plan, recipes);

  const handleCopy = () => {
    navigator.clipboard.writeText(shareUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    });
  };

  if (activeDays.length === 0) {
    return (
      <div className="empty">
        <div className="empty-ico">🛒</div>
        <h3>No meals planned</h3>
        <p>Go back to the planner and add some meals first.</p>
        <button className="btn-p" style={{margin:"1.5rem auto 0"}} onClick={onBack}>← Back to Planner</button>
      </div>
    );
  }

  return (
    <>
      <div className="pg-head">
        <h1 className="pg-title">Your Week</h1>
        <p className="pg-desc">
          {activeDays.length} dinner{activeDays.length !== 1 ? "s" : ""} planned · {groceryList.length} unique ingredients
        </p>
      </div>

      {/* Share bar */}
      <div className="share-bar">
        <p>📤 <strong>Share or save this week</strong> — copy the link below to bookmark or send to someone.</p>
        <input className="share-input" readOnly value={shareUrl} onFocus={e => e.target.select()} />
        <button className="btn-s" onClick={handleCopy} style={{flexShrink:0}}>
          {copied ? "✓ Copied!" : "Copy Link"}
        </button>
      </div>

      <div className="summary-grid">

        {/* Weekly schedule */}
        <div className="summary-section">
          <h2>📅 This Week's Dinners</h2>
          <ul className="schedule-list">
            {plan.map((slot, i) => {
              const recipe = recipes.find(r => r.id === slot.recipeId);
              return (
                <li key={i} className="schedule-item">
                  <span className="schedule-day">{slot.day.slice(0,3)}</span>
                  {slot.skipped
                    ? <span className="schedule-skip">Night off</span>
                    : recipe
                      ? <span className="schedule-name">
                          {recipe.url
                            ? <a href={recipe.url} target="_blank" rel="noopener noreferrer">{recipe.name}</a>
                            : recipe.name}
                        </span>
                      : <span className="schedule-skip">No meal</span>
                  }
                </li>
              );
            })}
          </ul>
        </div>

        {/* Grocery list */}
        <div className="summary-section">
          <h2>🛒 Grocery List</h2>
          <ul className="grocery-list">
            {groceryList.map((item, i) => (
              <li key={i} className="grocery-item">
                <span className="grocery-name">{item.name}</span>
                <span className="grocery-qty">
                  {item.quantity % 1 === 0 ? item.quantity : item.quantity}{item.unit ? " " + item.unit : ""}
                </span>
              </li>
            ))}
          </ul>
        </div>

      </div>

      <div style={{display:"flex",gap:".75rem",marginTop:"2rem",flexWrap:"wrap"}}>
        <button className="btn-s" onClick={onBack}>← Back to Planner</button>
        <button className="btn-p" onClick={() => {
          const text = [
            "THIS WEEK\'S DINNERS",
            "==================",
            ...plan.map(d => {
              if (d.skipped) return d.day + ": Night off";
              const r = recipes.find(r => r.id === d.recipeId);
              return d.day + ": " + (r ? r.name : "—");
            }),
            "",
            "GROCERY LIST",
            "============",
            ...groceryList.map(i => `${i.name}: ${i.quantity}${i.unit ? " " + i.unit : ""}`)
          ].join("\n");
          navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard!"));
        }}>
          📋 Copy as Text
        </button>
      </div>
    </>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView]           = useState("library");
  const [recipes, setRecipes]     = useState([]);
  const [loaded, setLoaded]       = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [plan, setPlan]           = useState(null); // array of 7 day slots
  const [jsonPaste, setJsonPaste] = useState("");
  const [importStatus, setImportStatus] = useState(null);

  useEffect(() => {
    Promise.all([loadRecipes(), loadPlan()]).then(([r, p]) => {
      setRecipes(r);
      setPlan(p || buildEmptyWeek());
      setLoaded(true);
    });
  }, []);

  // ── Library handlers ──
  const handleJsonImport = async () => {
    const raw = jsonPaste.trim();
    if (!raw) return;
    try {
      const result = parseRecipeJson(raw);
      const recipe = {
        id: Date.now().toString(),
        name: result.name, url: result.url || "",
        servings: Number(result.servings) || 4,
        ingredients: (result.ingredients || []).map(({name,quantity,unit,category}) => ({
          name: name||"", quantity: Number(quantity)||1, unit: unit||"", category: category||"other",
        })),
        addedAt: new Date().toISOString(),
      };
      const updated = [...recipes, recipe];
      setRecipes(updated);
      await saveRecipes(updated);
      setJsonPaste("");
      setImportStatus({ type:"success", msg:`✓ "${recipe.name}" added — ${recipe.ingredients.length} ingredients.` });
      setTimeout(() => setImportStatus(null), 5000);
    } catch(e) {
      setImportStatus({ type:"error", msg: e.message });
    }
  };

  const handleDeleteRecipe = async (id) => {
    const updated = recipes.filter(r => r.id !== id);
    setRecipes(updated);
    await saveRecipes(updated);
    // If deleted recipe is in plan, clear that slot
    if (plan) {
      const updatedPlan = plan.map(d => d.recipeId === id ? {...d, recipeId: null} : d);
      setPlan(updatedPlan);
      await savePlan(updatedPlan);
    }
  };

  const handleSaveManual = async (recipe) => {
    const updated = [...recipes, recipe];
    setRecipes(updated);
    await saveRecipes(updated);
    setShowModal(false);
  };

  // ── Export / Import handlers ──
  const handleExport = () => {
    const json = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), recipes }, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mise-en-place-library.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImportFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const imported = Array.isArray(data) ? data : data.recipes;
      if (!Array.isArray(imported)) throw new Error("Invalid format — expected a recipes array.");
      // Merge: skip any recipe whose name already exists in library
      const existingNames = new Set(recipes.map(r => r.name.toLowerCase().trim()));
      const newOnes = imported.filter(r => r.name && !existingNames.has(r.name.toLowerCase().trim()));
      const dupes = imported.length - newOnes.length;
      const updated = [...recipes, ...newOnes];
      setRecipes(updated);
      await saveRecipes(updated);
      const msg = newOnes.length
        ? `✓ Imported ${newOnes.length} recipe${newOnes.length!==1?"s":""}${dupes ? ` (${dupes} duplicate${dupes!==1?"s":""} skipped)` : ""}.`
        : `No new recipes imported — all ${dupes} were already in your library.`;
      setImportStatus({ type: newOnes.length ? "success" : "error", msg });
      setTimeout(() => setImportStatus(null), 6000);
    } catch(err) {
      setImportStatus({ type: "error", msg: "Import failed: " + err.message });
      setTimeout(() => setImportStatus(null), 6000);
    }
    // Reset file input so same file can be re-imported if needed
    e.target.value = "";
  };

  // ── Planner handlers ──
  const handleGenerate = async () => {
    const newPlan = generateWeek(recipes, plan);
    setPlan(newPlan);
    await savePlan(newPlan);
  };

  const handleReroll = async (i) => {
    const newPlan = rerollDay(i, recipes, plan);
    setPlan(newPlan);
    await savePlan(newPlan);
  };

  const handleSkip = async (i) => {
    const newPlan = plan.map((d, idx) =>
      idx === i ? { ...d, skipped: !d.skipped, recipeId: d.skipped ? d.recipeId : d.recipeId } : d
    );
    setPlan(newPlan);
    await savePlan(newPlan);
  };

  const handlePick = async (i, recipeId) => {
    const newPlan = plan.map((d, idx) => idx === i ? { ...d, recipeId, skipped: false } : d);
    setPlan(newPlan);
    await savePlan(newPlan);
  };

  const activeDays = plan ? plan.filter(d => !d.skipped && d.recipeId) : [];
  const allFilled  = plan ? plan.every(d => d.skipped || d.recipeId) : false;
  const canGenerate = recipes.length >= 7;

  return (
    <div className="app">
      <style>{S}</style>

      <header className="hdr">
        <div className="hdr-brand">
          <span className="hdr-title">Mise en Place</span>
          <span className="hdr-sub">Weekly Dinner Planner</span>
        </div>
        <nav className="nav">
          <button className={`nav-btn ${view==="library"?"on":""}`} onClick={()=>setView("library")}>
            Library {recipes.length>0 && <span className="badge">{recipes.length}</span>}
          </button>
          <button className={`nav-btn ${view==="planner"?"on":""}`} onClick={()=>setView("planner")}>Planner</button>
          <button className={`nav-btn ${view==="summary"?"on":""}`} onClick={()=>setView("summary")}>Summary</button>
        </nav>
      </header>

      <main className="main">

        {/* ── LIBRARY ── */}
        {view==="library" && (
          <>
            <div className="pg-head">
              <h1 className="pg-title">Recipe Library</h1>
              <p className="pg-desc">Paste a Claude-extracted JSON snippet to add a recipe instantly, or enter one manually.</p>
            </div>

            <div style={{background:"var(--warm)",border:"1.5px solid var(--bdr)",borderRadius:12,padding:"1.5rem",marginBottom:"2rem",boxShadow:"var(--sh)"}}>
              <div style={{fontSize:".78rem",fontWeight:500,textTransform:"uppercase",letterSpacing:".06em",color:"var(--muted)",marginBottom:".3rem"}}>Import Recipe</div>
              <div style={{fontSize:".83rem",color:"var(--muted)",marginBottom:".75rem"}}>
                Paste a recipe URL in the <strong style={{color:"var(--bark)"}}>Claude chat</strong> → I'll return a JSON snippet → paste it below.
              </div>
              <div style={{display:"flex",gap:".75rem",alignItems:"flex-start"}}>
                <textarea className="inp" rows={3}
                  placeholder={'Paste Claude\'s JSON here, e.g.:\n{"name":"Pesto Chicken","servings":6,"ingredients":[...]}'}
                  value={jsonPaste} onChange={e=>setJsonPaste(e.target.value)}
                  style={{flex:1,resize:"vertical",fontFamily:"monospace",fontSize:".8rem",lineHeight:1.5}}
                />
                <button className="btn-p" onClick={handleJsonImport} disabled={!jsonPaste.trim()} style={{flexShrink:0,marginTop:".1rem"}}>
                  Add to Library
                </button>
              </div>
              {importStatus && (
                <div style={{marginTop:".75rem",padding:".65rem 1rem",borderRadius:8,fontSize:".87rem",
                  background:importStatus.type==="error"?"#fde8e0":"var(--sage2)",
                  color:importStatus.type==="error"?"#a33010":"var(--sage)"}}>
                  {importStatus.type==="error" && "⚠️ "}{importStatus.msg}
                </div>
              )}
            </div>

            <div className="lib-hdr">
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.1rem",color:"#c0240e"}}>
                Your Recipes
                <span className="lib-count">{recipes.length} saved · {Math.max(0,7-recipes.length)} more needed to plan</span>
              </h2>
              <div style={{display:"flex",gap:".5rem",flexWrap:"wrap"}}>
                <button className="btn-s" onClick={handleExport} disabled={recipes.length===0} title="Export library as JSON">
                  ⬇ Export
                </button>
                <label className="btn-s" style={{cursor:"pointer"}} title="Import a previously exported library JSON">
                  ⬆ Import
                  <input type="file" accept=".json" style={{display:"none"}} onChange={handleImportFile} />
                </label>
                <button className="btn-s" onClick={()=>setShowModal(true)}>+ Add Manually</button>
              </div>
            </div>

            {!loaded
              ? <div className="empty"><div className="spin" style={{margin:"0 auto",width:28,height:28}}/></div>
              : recipes.length===0
                ? <div className="empty">
                    <div className="empty-ico">🫙</div>
                    <h3>Your library is empty</h3>
                    <p>Paste a recipe URL in the chat above to get started.</p>
                  </div>
                : <div className="grid">{recipes.map(r=><RecipeCard key={r.id} recipe={r} onDelete={handleDeleteRecipe}/>)}</div>
            }
          </>
        )}

        {/* ── PLANNER ── */}
        {view==="planner" && (
          <>
            <div className="pg-head">
              <h1 className="pg-title">Weekly Planner</h1>
              <p className="pg-desc">Generate your week, then tweak each day until it's perfect.</p>
            </div>

            {!canGenerate && (
              <div className="warn">
                <span>⚠️</span>
                <span>You need at least 7 recipes in your library to generate a full week. You have <strong>{recipes.length}</strong> — add {7-recipes.length} more to get started.</span>
              </div>
            )}

            <div className="planner-actions">
              <button className="btn-p" onClick={handleGenerate} disabled={!canGenerate}>
                🔀 Generate Week
              </button>
              {allFilled && (
                <button className="btn-p" style={{background:"#c8860a",border:"none"}} onClick={()=>setView("summary")}>
                  ✅ Finalize Week →
                </button>
              )}
            </div>

            {plan && (
              <div className="week-grid">
                {plan.map((slot, i) => (
                  <DayRow
                    key={slot.day}
                    slot={slot}
                    recipes={recipes}
                    onReroll={() => handleReroll(i)}
                    onSkip={() => handleSkip(i)}
                    onPick={(id) => handlePick(i, id)}
                  />
                ))}
              </div>
            )}
          </>
        )}

        {/* ── SUMMARY ── */}
        {view==="summary" && (
          <SummaryView plan={plan} recipes={recipes} onBack={()=>setView("planner")} />
        )}

      </main>

      {showModal && (
        <AddRecipeModal
          onClose={()=>setShowModal(false)}
          onSave={handleSaveManual}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

  </script>
</body>
</html>
